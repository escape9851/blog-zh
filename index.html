<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>escape - 逃离现实</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #efefeb;
      --bg-soft: rgba(255, 255, 255, 0.8);
      --text: #151515;
      --muted: #66625b;
      --line: rgba(21, 21, 21, 0.14);
      --accent: #1a54e8;
      --radius: 24px;
      --shadow: 0 20px 60px rgba(15, 20, 36, 0.12);
      --max-width: 1140px;
    }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 10% 10%, rgba(66, 102, 235, 0.15), transparent 34%),
        radial-gradient(circle at 88% 16%, rgba(255, 255, 255, 0.65), transparent 34%),
        linear-gradient(180deg, #f5f5f3 0%, #e9e8e3 100%);
    }

    .fog {
      position: fixed;
      width: 42vmin;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(48px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.36;
    }

    .fog-a { top: 18vh; left: -12vmin; background: rgba(26, 84, 232, 0.34); }
    .fog-b { right: -8vmin; top: 8vh; background: rgba(255, 255, 255, 0.8); opacity: 0.58; }

    nav {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, var(--max-width));
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(12, 20, 38, 0.1);
      padding: 10px 12px 10px 18px;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .nav-logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-links { display: flex; align-items: center; gap: 6px; }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: 0.22s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.88);
      border-color: rgba(20, 20, 20, 0.08);
    }

    main {
      width: min(92vw, var(--max-width));
      margin: 0 auto;
      padding: 118px 0 74px;
    }

    .loading {
      padding: 120px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .hero {
      min-height: 52vh;
      display: grid;
      align-content: center;
      gap: 24px;
      margin-bottom: 30px;
    }

    .hero-top { display: flex; align-items: center; gap: 15px; }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 30px rgba(12, 32, 88, 0.2);
    }

    .hero-label {
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 500;
    }

    .hero h1 {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(40px, 8vw, 86px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      max-width: 14ch;
    }

    .hero .subtitle {
      color: var(--muted);
      font-size: clamp(18px, 2.6vw, 26px);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      max-width: 680px;
    }

    .metric {
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(255, 255, 255, 0.95);
      padding: 14px;
    }

    .metric b { font-size: 26px; line-height: 1.1; display: block; }
    .metric span { color: var(--muted); font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; }

    .block { margin-bottom: 34px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .section-head h2 { font-size: clamp(24px, 4vw, 38px); letter-spacing: -0.02em; }
    .section-head p { color: var(--muted); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }

    .pin-gallery {
      background: var(--bg-soft);
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: var(--shadow);
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    .pin-gallery-shell {
      display: grid;
      grid-template-columns: 88px minmax(0, 1.15fr) minmax(0, 0.85fr);
      gap: 14px;
      min-height: 72vh;
    }

    .pin-index {
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.95);
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .pin-index button {
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 10px 4px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .pin-index button.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(20, 20, 20, 0.12);
    }

    .pin-stage {
      position: relative;
      border-radius: 22px;
      min-height: 460px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: #d7dbe2;
    }

    .stack-item {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.08);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    .stack-item.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .stack-item img,
    .stack-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .pin-copy {
      position: relative;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.78);
      overflow: hidden;
      min-height: 460px;
    }

    .copy-item {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: 28px 24px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.34s ease, transform 0.34s ease;
      pointer-events: none;
    }

    .copy-item.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 10px;
      background: rgba(255, 255, 255, 0.66);
    }

    .copy-item h3 {
      font-size: clamp(26px, 4.2vw, 44px);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .copy-item p {
      font-size: 15px;
      color: #2f2f2f;
      max-width: 34ch;
      white-space: pre-line;
    }

    .story-wrap { display: grid; gap: 14px; }

    .story-panel {
      min-height: 68vh;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 26px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      transform: translateY(28px);
      opacity: 0;
    }

    .story-media,
    .story-media video,
    .story-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #151515;
      display: block;
      min-height: 420px;
    }

    .story-body {
      padding: clamp(20px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .story-body h3 {
      font-size: clamp(24px, 4vw, 40px);
      line-height: 1.12;
      letter-spacing: -0.02em;
    }

    .story-body p { color: #2f2f2f; font-size: 16px; white-space: pre-line; }

    .about {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: clamp(24px, 4vw, 44px);
    }

    .about p {
      font-size: clamp(16px, 2vw, 22px);
      color: #333;
      margin-bottom: 14px;
      max-width: 48ch;
    }

    .about p:last-child { margin-bottom: 0; color: var(--accent); font-weight: 600; }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.52);
      color: var(--muted);
      padding: 40px 20px;
      text-align: center;
    }

    footer {
      width: min(92vw, var(--max-width));
      margin: 0 auto 26px;
      border-top: 1px solid rgba(21, 21, 21, 0.12);
      padding-top: 16px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    @media (max-width: 980px) {
      .pin-gallery-shell {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .pin-index {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .pin-stage,
      .pin-copy {
        min-height: 360px;
      }

      .story-panel {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .story-media,
      .story-media video,
      .story-media img {
        min-height: 300px;
      }
    }

    @media (max-width: 820px) {
      nav { top: 12px; border-radius: 18px; }
      .nav-logo { display: none; }
      .nav-links { width: 100%; justify-content: space-between; }
      .nav-links a { flex: 1; text-align: center; padding: 9px 8px; }
      .hero { min-height: auto; margin-bottom: 24px; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metrics .metric:last-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="fog fog-a" aria-hidden="true"></div>
  <div class="fog fog-b" aria-hidden="true"></div>

  <nav>
    <div class="nav-logo">escape journal</div>
    <div class="nav-links">
      <a href="#" data-page="home" class="active">首页</a>
      <a href="#" data-page="articles">随笔</a>
      <a href="#" data-page="about">关于</a>
    </div>
  </nav>

  <main id="content">
    <div class="loading">正在加载内容...</div>
  </main>

  <footer>© 2026 escape / all moments are drafts.</footer>

  <script>
    let data = { articles: [], settings: {} };
    let page = 'home';

    const categoryLabel = {
      tech: '技术',
      thought: '思考',
      life: '生活',
      other: '其他',
      image: '图片',
      video: '视频'
    };

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function toSafeText(str) {
      return escapeHtml(str).replace(/\n/g, '<br>');
    }

    async function load() {
      try {
        const res = await fetch('/api/blog', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get' })
        });
        if (!res.ok) throw new Error('api failed');
        const json = await res.json();
        data = json.data || { articles: [], settings: {} };
      } catch (_) {
        try {
          const fallback = await fetch('/data.json');
          data = await fallback.json();
        } catch (_) {
          data = { articles: [], settings: {} };
        }
      }
      render();
    }

    function getPublishedArticles() {
      return (data.articles || [])
        .filter(a => a && a.status !== 'draft')
        .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    }

    function buildFallbackItems() {
      return [
        {
          title: '视觉分层',
          date: '2026-03-11',
          category: 'design',
          excerpt: '这是默认示例内容，用于确保滚动交互在无数据时也可见。',
          image_url: 'background.jpg',
          video_url: ''
        },
        {
          title: '滚动固定',
          date: '2026-03-11',
          category: 'interaction',
          excerpt: 'Pin 区域会在滚动时固定，索引与图片栈同步切换。',
          image_url: 'avatar.jpg',
          video_url: ''
        },
        {
          title: '分段叙事',
          date: '2026-03-11',
          category: 'story',
          excerpt: 'Section-based scrolling 会把内容分段展示，阅读更连贯。',
          image_url: 'background.jpg',
          video_url: ''
        }
      ];
    }

    function renderPinGallery(items) {
      if (!items.length) return '<div class="empty">暂无媒体内容，先去后台上传图片或视频。</div>';

      const indexHtml = items.map((_, i) => `<button class="pin-dot ${i === 0 ? 'active' : ''}" data-idx="${i}">${String(i + 1).padStart(2, '0')}</button>`).join('');

      const stackHtml = items.map((a, i) => {
        const title = escapeHtml(a.title || '未命名内容');
        const imageUrl = a.image_url ? escapeHtml(a.image_url) : '';
        const videoUrl = a.video_url ? escapeHtml(a.video_url) : '';
        const media = videoUrl
          ? `<video src="${videoUrl}" muted loop playsinline preload="metadata"></video>`
          : `<img src="${imageUrl || 'background.jpg'}" alt="${title}" loading="lazy" onerror="this.src='background.jpg'">`;
        return `<div class="stack-item ${i === 0 ? 'active' : ''}" data-idx="${i}">${media}</div>`;
      }).join('');

      const copyHtml = items.map((a, i) => {
        const title = escapeHtml(a.title || '未命名内容');
        const date = escapeHtml(a.date || '');
        const category = categoryLabel[a.category] || escapeHtml(a.category || '随笔');
        const excerpt = toSafeText(a.excerpt || a.content || '没有摘要');
        return `
          <article class="copy-item ${i === 0 ? 'active' : ''}" data-idx="${i}">
            <div class="meta"><span>${date}</span><span class="pill">${category}</span></div>
            <h3>${title}</h3>
            <p>${excerpt}</p>
          </article>
        `;
      }).join('');

      return `
        <section class="block">
          <div class="section-head reveal"><h2>Pin Gallery</h2><p>scroll trigger pin / image stack</p></div>
          <div class="pin-gallery" id="pinGallery" data-count="${items.length}">
            <div class="pin-gallery-shell">
              <div class="pin-index">${indexHtml}</div>
              <div class="pin-stage">${stackHtml}</div>
              <div class="pin-copy">${copyHtml}</div>
            </div>
          </div>
        </section>
      `;
    }

    function renderStoryPanels(items) {
      if (!items.length) return '<div class="empty">暂无文章。</div>';
      return `
        <section class="block" id="storySections">
          <div class="section-head reveal"><h2>Section Scroll</h2><p>section-based storytelling</p></div>
          <div class="story-wrap">
            ${items.map((a) => {
              const title = escapeHtml(a.title || '未命名内容');
              const date = escapeHtml(a.date || '');
              const category = categoryLabel[a.category] || escapeHtml(a.category || '随笔');
              const excerpt = toSafeText(a.excerpt || a.content || '没有摘要');
              const imageUrl = a.image_url ? escapeHtml(a.image_url) : '';
              const videoUrl = a.video_url ? escapeHtml(a.video_url) : '';
              const media = videoUrl
                ? `<video src="${videoUrl}" controls preload="metadata"></video>`
                : `<img src="${imageUrl || 'background.jpg'}" alt="${title}" loading="lazy" onerror="this.src='background.jpg'">`;

              return `
                <article class="story-panel">
                  <div class="story-media">${media}</div>
                  <div class="story-body">
                    <div class="meta"><span>${date}</span><span class="pill">${category}</span></div>
                    <h3>${title}</h3>
                    <p>${excerpt}</p>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function renderHome(articles, settings) {
      const title = escapeHtml(settings.title || 'escape');
      const subtitle = escapeHtml(settings.subtitle || '逃离现实，记录真实想法。');
      const fallbackItems = buildFallbackItems();
      const mediaItems = (() => {
        const withMedia = articles.filter(a => a.image_url || a.video_url).slice(0, 6);
        if (withMedia.length >= 2) return withMedia;
        if (articles.length >= 2) {
          return articles.slice(0, 4).map((a, i) => ({
            ...a,
            image_url: a.image_url || (i % 2 === 0 ? 'background.jpg' : 'avatar.jpg')
          }));
        }
        return fallbackItems;
      })();

      const storyItems = (() => {
        if (articles.length >= 2) {
          return articles.slice(0, 5).map((a, i) => ({
            ...a,
            image_url: a.image_url || (i % 2 === 0 ? 'background.jpg' : 'avatar.jpg')
          }));
        }
        return fallbackItems;
      })();
      const imageCount = articles.filter(a => a.image_url).length;
      const videoCount = articles.filter(a => a.video_url).length;

      return `
        <section class="hero">
          <div class="hero-top reveal">
            <img src="avatar.jpg" alt="avatar" class="avatar" loading="lazy">
            <span class="hero-label">scrolltrigger interaction</span>
          </div>
          <h1 class="reveal">${title}</h1>
          <p class="subtitle reveal">${subtitle}</p>
          <div class="metrics reveal">
            <div class="metric"><b>${articles.length}</b><span>篇内容</span></div>
            <div class="metric"><b>${imageCount}</b><span>图片条目</span></div>
            <div class="metric"><b>${videoCount}</b><span>视频条目</span></div>
          </div>
        </section>

        ${renderPinGallery(mediaItems)}
        ${renderStoryPanels(storyItems)}
      `;
    }

    function renderArticles(articles) {
      return renderStoryPanels(articles);
    }

    function renderAbout(settings) {
      const title = escapeHtml(settings.title || 'escape');
      const subtitle = escapeHtml(settings.subtitle || '保持好奇，保持输出。');
      return `
        <section class="about reveal">
          <p>你好，我是 ${title}。这里是我的个人网页，记录技术、生活和想法。</p>
          <p>${subtitle}</p>
          <p>Stay curious. Keep shipping.</p>
        </section>
      `;
    }

    function render() {
      const container = document.getElementById('content');
      const articles = getPublishedArticles();
      const settings = data.settings || {};

      if (page === 'home') {
        container.innerHTML = renderHome(articles, settings);
      } else if (page === 'articles') {
        container.innerHTML = renderArticles(articles);
      } else {
        container.innerHTML = renderAbout(settings);
      }

      initEffects();
    }

    function showPage(next) {
      page = next;
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.classList.toggle('active', link.dataset.page === next);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function initEffects() {
      if (!(window.gsap && window.ScrollTrigger)) return;
      gsap.registerPlugin(ScrollTrigger);
      ScrollTrigger.getAll().forEach(t => t.kill());

      gsap.to('.fog-a', {
        y: -90,
        x: 60,
        scrollTrigger: { trigger: document.body, start: 'top top', end: 'bottom top', scrub: 1.4 }
      });

      gsap.to('.fog-b', {
        y: 90,
        x: -60,
        scrollTrigger: { trigger: document.body, start: 'top top', end: 'bottom top', scrub: 1.8 }
      });

      gsap.fromTo('.reveal',
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, stagger: 0.06, duration: 0.65, ease: 'power2.out', overwrite: 'auto' }
      );

      initPinGallery();
      initSectionScroll();
    }

    function initPinGallery() {
      const gallery = document.getElementById('pinGallery');
      if (!gallery) return;

      const count = Number(gallery.dataset.count || 0);
      if (count < 2) return;

      const dots = Array.from(gallery.querySelectorAll('.pin-dot'));
      const stackItems = Array.from(gallery.querySelectorAll('.stack-item'));
      const copyItems = Array.from(gallery.querySelectorAll('.copy-item'));
      const videos = stackItems.map(item => item.querySelector('video')).filter(Boolean);
      let active = -1;

      function setActive(index) {
        if (index === active) return;
        active = index;

        dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
        stackItems.forEach((item, i) => item.classList.toggle('active', i === index));
        copyItems.forEach((item, i) => item.classList.toggle('active', i === index));

        videos.forEach(v => v.pause());
        const currentVideo = stackItems[index] && stackItems[index].querySelector('video');
        if (currentVideo) {
          currentVideo.currentTime = 0;
          currentVideo.play().catch(() => {});
        }
      }

      setActive(0);

      const usePin = window.matchMedia('(min-width: 981px)').matches;
      const trigger = ScrollTrigger.create({
        trigger: gallery,
        start: usePin ? 'top top+=96' : 'top 76%',
        end: usePin ? `+=${Math.max(1200, count * 380)}` : 'bottom 40%',
        pin: usePin,
        scrub: true,
        anticipatePin: usePin ? 1 : 0,
        onUpdate: self => {
          const idx = Math.min(count - 1, Math.max(0, Math.round(self.progress * (count - 1))));
          setActive(idx);
        }
      });

      dots.forEach((dot, i) => {
        dot.addEventListener('click', () => {
          setActive(i);
          const target = trigger.start + ((trigger.end - trigger.start) * (i / (count - 1)));
          window.scrollTo({ top: target, behavior: 'smooth' });
        });
      });
    }

    function initSectionScroll() {
      const panels = gsap.utils.toArray('.story-panel');
      if (!panels.length) return;

      panels.forEach((panel) => {
        gsap.to(panel, {
          opacity: 1,
          y: 0,
          duration: 0.7,
          ease: 'power2.out',
          scrollTrigger: {
            trigger: panel,
            start: 'top 82%'
          }
        });
      });

      if (panels.length > 1) {
        const wrap = document.getElementById('storySections');
        ScrollTrigger.create({
          trigger: wrap,
          start: 'top top+=100',
          end: 'bottom bottom',
          snap: {
            snapTo: (value) => {
              const step = 1 / (panels.length - 1);
              return Math.round(value / step) * step;
            },
            duration: 0.24,
            delay: 0.04
          }
        });
      }
    }

    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        showPage(link.dataset.page);
      });
    });

    load();
  </script>
</body>
</html>
