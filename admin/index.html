<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>escape 博客管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #6366f1; --primary-dark: #4f46e5; --bg: #0f172a; --card: #1e293b; --card-hover: #334155; --border: #475569; --text: #f8fafc; --text-light: #94a3b8; --success: #22c55e; --danger: #ef4444; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    /* 登录 */
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: linear-gradient(135deg, #1e1b4b, #0f172a); }
    .login-box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 48px; width: 100%; max-width: 400px; text-align: center; }
    .login-box h1 { font-size: 28px; margin-bottom: 8px; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .login-box input { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; margin-bottom: 16px; }
    .login-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    
    /* 后台 */
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--card); border-right: 1px solid var(--border); padding: 20px; }
    .sidebar-logo { font-size: 18px; font-weight: 700; margin-bottom: 30px; }
    .nav-item { padding: 12px 16px; border-radius: 10px; color: var(--text-light); cursor: pointer; margin-bottom: 4px; }
    .nav-item:hover { background: var(--card-hover); color: var(--text); }
    .nav-item.active { background: rgba(99,102,241,0.2); color: var(--primary); }
    
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .page-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
    
    /* 卡片 */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    
    /* 表单 */
    input, textarea, select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); margin-bottom: 12px; }
    textarea { min-height: 120px; resize: vertical; }
    label { display: block; margin-bottom: 6px; color: var(--text-light); font-size: 14px; }
    
    /* 按钮 */
    .btn { padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: white; }
    
    /* 文章列表 */
    .article-list { display: flex; flex-direction: column; gap: 12px; }
    .article-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--bg); border-radius: 10px; }
    .article-item h4 { margin-bottom: 4px; }
    .article-item .date { font-size: 13px; color: var(--text-light); }
    .article-item .actions { display: flex; gap: 8px; }
    
    /* Toast */
    .toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 10px; color: white; font-weight: 500; z-index: 1000; animation: slideIn 0.3s; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.loading { background: var(--primary); }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 登录页 -->
  <div id="login" class="login-screen">
    <div class="login-box">
      <h1>escape 博客后台</h1>
      <p>请输入管理密码</p>
      <input type="password" id="password" placeholder="密码">
      <button onclick="login()">登录</button>
    </div>
  </div>
  
  <!-- 后台 -->
  <div id="admin" class="admin-layout hidden">
    <div class="sidebar">
      <div class="sidebar-logo">📝 escape 博客</div>
      <div class="nav-item active" onclick="showPage('articles')">📄 文章管理</div>
      <div class="nav-item" onclick="showPage('images')">🖼️ 图片管理</div>
      <div class="nav-item" onclick="showPage('settings')">⚙️ 网站设置</div>
      <div class="nav-item" onclick="logout()" style="margin-top: auto;">🚪 退出</div>
    </div>
    
    <div class="main-content">
      <!-- 文章管理 -->
      <div id="page-articles">
        <h1 class="page-title">文章管理</h1>
        <div class="card">
          <div class="card-title">➕ 添加新文章</div>
          <label>标题</label>
          <input type="text" id="article-title" placeholder="文章标题">
          <label>分类</label>
          <select id="article-category">
            <option value="tech">技术</option>
            <option value="thought">思考</option>
            <option value="life">生活</option>
            <option value="other">其他</option>
          </select>
          <label>摘要</label>
          <input type="text" id="article-excerpt" placeholder="文章摘要">
          <label>内容</label>
          <textarea id="article-content" placeholder="文章内容"></textarea>
          <button class="btn btn-primary" onclick="saveArticle()">保存文章</button>
        </div>
        
        <div class="card">
          <div class="card-title">📋 所有文章</div>
          <div class="article-list" id="article-list"></div>
        </div>
      </div>
      
      <!-- 图片管理 -->
      <div id="page-images" class="hidden">
        <h1 class="page-title">图片管理</h1>
        <div class="card">
          <div class="card-title">🖼️ 上传本地图片</div>
          <p style="color: var(--text-light); margin-bottom: 16px;">
            直接选择图片文件上传（免费图床，自动生成链接）
          </p>
          <input type="file" id="image-file" accept="image/*" onchange="uploadImageFile(event)" style="display: none;">
          <button class="btn btn-primary" onclick="document.getElementById('image-file').click()" style="font-size: 16px; padding: 16px 32px;">
            📁 选择图片文件
          </button>
          <p id="upload-status" style="margin-top: 12px; color: var(--text-light);"></p>
        </div>
        
        <div class="card">
          <div class="card-title">🔗 或者添加图片链接</div>
          <input type="text" id="image-url" placeholder="https://xxx.com/image.jpg">
          <button class="btn btn-secondary" onclick="addImageUrl()">添加链接</button>
        </div>
        
        <div class="card">
          <div class="card-title">📸 已添加的图片</div>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;" id="image-gallery"></div>
        </div>
      </div>
      
      <!-- 设置 -->
      <div id="page-settings" class="hidden">
        <h1 class="page-title">网站设置</h1>
        <div class="card">
          <div class="card-title">基本设置</div>
          <label>博客标题</label>
          <input type="text" id="setting-title" value="escape">
          <label>副标题</label>
          <input type="text" id="setting-subtitle" value="技术 · 生活 · 思考">
          <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
        </div>
      </div>
    </div>
  </div>
  
  <div id="toast" class="toast hidden"></div>
  
  <script>
    const API_URL = '/api/blog';
    const ADMIN_PASSWORD = 'escape123';
    let articles = [];
    let settings = {};
    let editingId = null;
    
    // 登录
    function login() {
      const pwd = document.getElementById('password').value;
      if (pwd === ADMIN_PASSWORD) {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('admin').classList.remove('hidden');
        loadData();
      } else {
        showToast('密码错误', 'error');
      }
    }
    
    function logout() {
      document.getElementById('login').classList.remove('hidden');
      document.getElementById('admin').classList.add('hidden');
    }
    
    // 加载数据
    async function loadData() {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: 'get'})
        });
        const data = await res.json();
        articles = data.data?.articles || [];
        settings = data.data?.settings || {};
        renderArticles();
        renderImages();
      } catch(e) {
        showToast('加载失败', 'error');
      }
    }
    
    // 保存数据
    async function saveData() {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            action: 'save',
            data: { articles, settings }
          })
        });
        return await res.json();
      } catch(e) {
        showToast('保存失败', 'error');
        return {error: e.message};
      }
    }
    
    // 渲染文章列表
    function renderArticles() {
      const list = document.getElementById('article-list');
      if (articles.length === 0) {
        list.innerHTML = '<p style="color: var(--text-light);">暂无文章</p>';
        return;
      }
      list.innerHTML = articles.map(a => `
        <div class="article-item">
          <div>
            <h4>${a.title}</h4>
            <p class="date">${a.date} · ${a.category}</p>
          </div>
          <div class="actions">
            <button class="btn btn-secondary btn-sm" onclick="editArticle(${a.id})">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="deleteArticle(${a.id})">删除</button>
          </div>
        </div>
      `).join('');
    }
    
    // 保存文章
    async function saveArticle() {
      const title = document.getElementById('article-title').value;
      const category = document.getElementById('article-category').value;
      const excerpt = document.getElementById('article-excerpt').value;
      const content = document.getElementById('article-content').value;
      
      if (!title) {
        showToast('请输入标题', 'error');
        return;
      }
      
      showToast('保存中...', 'loading');
      
      if (editingId) {
        const idx = articles.findIndex(a => a.id === editingId);
        if (idx >= 0) {
          articles[idx] = {...articles[idx], title, category, excerpt, content};
        }
        editingId = null;
      } else {
        articles.push({
          id: Date.now(),
          title, category, excerpt, content,
          date: new Date().toISOString().split('T')[0],
          status: 'published'
        });
      }
      
      const result = await saveData();
      if (result.success) {
        showToast('保存成功', 'success');
        clearForm();
        renderArticles();
      } else {
        showToast('保存失败: ' + result.error, 'error');
      }
    }
    
    // 编辑文章
    function editArticle(id) {
      const a = articles.find(x => x.id === id);
      if (!a) return;
      editingId = id;
      document.getElementById('article-title').value = a.title;
      document.getElementById('article-category').value = a.category;
      document.getElementById('article-excerpt').value = a.excerpt || '';
      document.getElementById('article-content').value = a.content || '';
      window.scrollTo({top: 0, behavior: 'smooth'});
    }
    
    // 删除文章
    async function deleteArticle(id) {
      if (!confirm('确定删除这篇文章？')) return;
      articles = articles.filter(a => a.id !== id);
      const result = await saveData();
      if (result.success) {
        showToast('删除成功', 'success');
        renderArticles();
      }
    }
    
    // 清空表单
    function clearForm() {
      document.getElementById('article-title').value = '';
      document.getElementById('article-excerpt').value = '';
      document.getElementById('article-content').value = '';
      editingId = null;
    }
    
    // 图片管理
    function renderImages() {
      const images = articles.filter(a => a.category === 'image');
      const gallery = document.getElementById('image-gallery');
      if (images.length === 0) {
        gallery.innerHTML = '<p style="color: var(--text-light);">暂无图片</p>';
        return;
      }
      gallery.innerHTML = images.map(a => `
        <div style="background: var(--bg); border-radius: 8px; overflow: hidden;">
          <img src="${a.excerpt}" style="width: 100%; height: 120px; object-fit: cover;" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><rect fill=%22%23333%22 width=%22100%25%22 height=%22100%22/><text fill=%22%23666%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22>图片失效</text></svg>'">
          <div style="padding: 8px; display: flex; justify-content: space-between;">
            <button class="btn btn-danger btn-sm" onclick="deleteImage(${a.id})">删除</button>
          </div>
        </div>
      `).join('');
    }
    
    async function addImageUrl() {
      const url = document.getElementById('image-url').value;
      if (!url) {
        showToast('请输入图片链接', 'error');
        return;
      }
      
      showToast('添加中...', 'loading');
      
      articles.push({
        id: Date.now(),
        title: '图片_' + Date.now(),
        date: new Date().toISOString().split('T')[0],
        category: 'image',
        excerpt: url,
        content: '',
        status: 'published'
      });
      
      const result = await saveData();
      if (result.success) {
        showToast('添加成功', 'success');
        document.getElementById('image-url').value = '';
        renderImages();
      } else {
        showToast('添加失败', 'error');
      }
    }
    
    async function deleteImage(id) {
      articles = articles.filter(a => a.id !== id);
      const result = await saveData();
      if (result.success) {
        renderImages();
      }
    }
    
    // 设置
    async function saveSettings() {
      settings.title = document.getElementById('setting-title').value;
      settings.subtitle = document.getElementById('setting-subtitle').value;
      const result = await saveData();
      if (result.success) {
        showToast('保存成功', 'success');
      }
    }
    
    // 页面切换
    function showPage(page) {
      document.querySelectorAll('.nav-item').forEach((el, i) => {
        el.classList.toggle('active', i === ['articles','images','settings'].indexOf(page));
      });
      ['articles','images','settings'].forEach(p => {
        document.getElementById('page-' + p).classList.toggle('hidden', p !== page);
      });
    }
    
    // Toast
    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + type;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }
  

    // 上传图片文件
    async function uploadImageFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const status = document.getElementById('upload-status');
      status.textContent = '上传中...';
      status.style.color = 'var(--primary)';
      
      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64 = e.target.result.split(',')[1];
        const fileName = file.name;
        
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              action: 'uploadImage',
              data: { imageData: base64, fileName: fileName }
            })
          });
          
          const result = await res.json();
          
          if (result.success) {
            status.textContent = '上传成功！';
            status.style.color = 'var(--success)';
            
            // 自动添加到图片列表
            articles.push({
              id: Date.now(),
              title: fileName,
              date: new Date().toISOString().split('T')[0],
              category: 'image',
              excerpt: result.url,
              content: '',
              status: 'published'
            });
            
            await saveData();
            renderImages();
            
            setTimeout(() => status.textContent = '', 3000);
          } else {
            status.textContent = '上传失败: ' + (result.error || '请重试');
            status.style.color = 'var(--danger)';
          }
        } catch(err) {
          status.textContent = '上传失败: ' + err.message;
          status.style.color = 'var(--danger)';
        }
      };
      reader.readAsDataURL(file);
    }
</script>
</body>
</html>
