<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>escape 博客管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #6366f1; --primary-dark: #4f46e5; --bg: #0f172a; --card: #1e293b; --card-hover: #334155; --border: #475569; --text: #f8fafc; --text-light: #94a3b8; --success: #22c55e; --danger: #ef4444; --warning: #f59e0b; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    /* 登录页 */
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); }
    .login-box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 48px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .login-box h1 { font-size: 28px; margin-bottom: 8px; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .login-box p { color: var(--text-light); margin-bottom: 32px; font-size: 14px; }
    .login-box input { width: 100%; padding: 14px 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; margin-bottom: 16px; transition: all 0.2s; }
    .login-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
    .login-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .login-box button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(99,102,241,0.5); }
    
    /* 后台布局 */
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--card); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; }
    .sidebar-logo { font-size: 20px; font-weight: 700; margin-bottom: 32px; padding: 0 12px; display: flex; align-items: center; gap: 10px; }
    .sidebar-logo span { background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; color: var(--text-light); cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
    .nav-item:hover { background: var(--card-hover); color: var(--text); }
    .nav-item.active { background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(168,85,247,0.2)); color: var(--primary); }
    .nav-item svg { width: 20px; height: 20px; }
    
    .main-content { flex: 1; padding: 32px; overflow-y: auto; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .page-title { font-size: 28px; font-weight: 700; }
    
    /* 按钮 */
    .btn { padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(99,102,241,0.5); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--card-hover); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-sm { padding: 8px 16px; font-size: 13px; }
    
    /* 卡片 */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card-title { font-size: 18px; font-weight: 600; }
    
    /* 表单 */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-light); font-weight: 500; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; transition: all 0.2s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
    .form-group textarea { min-height: 120px; resize: vertical; font-family: inherit; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    /* 表格 */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 14px 16px; color: var(--text-light); font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--border); }
    .data-table td { padding: 16px; border-bottom: 1px solid var(--border); }
    .data-table tr:hover { background: var(--card-hover); }
    
    /* 标签 */
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .badge-success { background: rgba(34,197,94,0.2); color: var(--success); }
    .badge-draft { background: rgba(148,163,184,0.2); color: var(--text-light); }
    .badge-tech { background: rgba(99,102,241,0.2); color: #818cf8; }
    .badge-life { background: rgba(236,72,153,0.2); color: #f472b6; }
    
    /* 网格 */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    @media (max-width: 1024px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } .sidebar { display: none; } .form-row { grid-template-columns: 1fr; } }
    
    /* 统计卡片 */
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center; }
    .stat-number { font-size: 36px; font-weight: 700; background: linear-gradient(135deg, var(--primary), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-label { font-size: 14px; color: var(--text-light); margin-top: 8px; }
    
    /* 消息提示 */
    .toast { position: fixed; top: 24px; right: 24px; padding: 16px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 1000; animation: slideIn 0.3s ease; }
    .toast-success { background: var(--success); color: white; }
    .toast-error { background: var(--danger); color: white; }
    .toast-loading { background: var(--primary); color: white; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    
    .hidden { display: none !important; }
    
    /* 图片上传 */
    .upload-area { border: 2px dashed var(--border); border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .upload-area:hover { border-color: var(--primary); background: rgba(99,102,241,0.05); }
    .image-preview { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-top: 16px; }
    
    /* 开关 */
    .toggle { position: relative; width: 48px; height: 26px; background: var(--border); border-radius: 13px; cursor: pointer; transition: all 0.2s; }
    .toggle.active { background: var(--success); }
    .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: all 0.2s; }
    .toggle.active::after { left: 25px; }
  </style>
</head>
<body>
  <!-- 登录页 -->
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1>🚀 Escape Admin</h1>
      <p>博客管理后台</p>
      <input type="password" id="password" placeholder="请输入访问密码">
      <button onclick="login()">登录</button>
    </div>
  </div>
  
  <!-- 后台主页 -->
  <div id="admin-panel" class="admin-layout hidden">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span>⚡</span> Escape Admin
      </div>
      <nav>
        <div class="nav-item active" onclick="showPage('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>数据概览</span>
        </div>
        <div class="nav-item" onclick="showPage('articles')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
          <span>文章管理</span>
        </div>
        <div class="nav-item" onclick="showPage('new-article')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>新建文章</span>
        </div>
        <div class="nav-item" onclick="showPage('settings')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>网站设置</span>
        </div>
        <div class="nav-item" onclick="showPage('images')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
          <span>图片管理</span>
        </div>
        <div class="nav-item" onclick="showPage('theme')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <span>主题样式</span>
        </div>
      </nav>
      <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border);">
        <div class="nav-item" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>退出登录</span>
        </div>
      </div>
    </aside>
    
    <!-- 主内容 -->
    <main class="main-content">
      <!-- 概览页 -->
      <div id="page-dashboard">
        <div class="page-header">
          <h1 class="page-title">数据概览</h1>
          <button class="btn btn-primary" onclick="showPage('new-article')">+ 新建文章</button>
        </div>
        <div class="grid-3" style="margin-bottom: 32px;">
          <div class="stat-card"><div class="stat-number" id="stat-articles">0</div><div class="stat-label">文章总数</div></div>
          <div class="stat-card"><div class="stat-number" id="stat-published">0</div><div class="stat-label">已发布</div></div>
          <div class="stat-card"><div class="stat-number" id="stat-views">-</div><div class="stat-label">总访问量</div></div>
        </div>
        <div class="card">
          <div class="card-header"><h3 class="card-title">最近文章</h3></div>
          <table class="data-table"><thead><tr><th>标题</th><th>分类</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="recent-articles"></tbody></table>
        </div>
      </div>
      
      <!-- 文章列表页 -->
      <div id="page-articles" class="hidden">
        <div class="page-header">
          <h1 class="page-title">文章管理</h1>
          <button class="btn btn-primary" onclick="showPage('new-article')">+ 新建文章</button>
        </div>
        <div class="card">
          <table class="data-table"><thead><tr><th>标题</th><th>分类</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="all-articles"></tbody></table>
        </div>
      </div>
      
      <!-- 新建文章页 -->
      <div id="page-new-article" class="hidden">
        <div class="page-header">
          <h1 class="page-title">新建文章</h1>
        </div>
        <div class="grid-2">
          <div>
            <div class="card">
              <h3 class="card-title" style="margin-bottom: 20px;">文章信息</h3>
              <div class="form-group"><label>标题 *</label><input type="text" id="article-title" placeholder="输入文章标题"></div>
              <div class="form-row">
                <div class="form-group"><label>日期</label><input type="date" id="article-date"></div>
                <div class="form-group"><label>分类</label><select id="article-category"><option value="tech">技术</option><option value="life">生活</option><option value="thought">思考</option></select></div>
              </div>
              <div class="form-group"><label>摘要</label><input type="text" id="article-excerpt" placeholder="简短描述"></div>
              <div class="form-group">
                <label>状态</label>
                <div style="display: flex; gap: 12px; margin-top: 8px;">
                  <div class="toggle active" id="article-published" onclick="this.classList.toggle('active')"></div>
                  <span>立即发布</span>
                </div>
              </div>
            </div>
          </div>
          <div>
            <div class="card">
              <h3 class="card-title" style="margin-bottom: 20px;">文章正文</h3>
              <div class="form-group"><textarea id="article-content" placeholder="在这里写文章内容..." style="min-height: 300px;"></textarea></div>
            </div>
          </div>
        </div>
        <div style="margin-top: 24px; display: flex; gap: 12px;">
          <button class="btn btn-primary" onclick="saveArticle()">💾 保存文章</button>
          <button class="btn btn-secondary" onclick="showPage('dashboard')">取消</button>
        </div>
      </div>
      
      <!-- 网站设置页 -->
      <div id="page-settings" class="hidden">
        <div class="page-header">
          <h1 class="page-title">网站设置</h1>
          <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
        </div>
        <div class="grid-2">
          <div class="card">
            <h3 class="card-title" style="margin-bottom: 20px;">基本信息</h3>
            <div class="form-group"><label>博客标题</label><input type="text" id="site-title" value="escape"></div>
            <div class="form-group"><label>副标题</label><input type="text" id="site-subtitle" value="技术 · 生活 · 思考"></div>
            <div class="form-group"><label>关于内容</label><textarea id="site-about" placeholder="关于我的介绍..."></textarea></div>
          </div>
          <div class="card">
            <h3 class="card-title" style="margin-bottom: 20px;">社交链接</h3>
            <div class="form-group"><label>GitHub</label><input type="text" id="social-github" placeholder="https://github.com/username"></div>
            <div class="form-group"><label>Twitter</label><input type="text" id="social-twitter" placeholder="https://twitter.com/username"></div>
            <div class="form-group"><label>Email</label><input type="text" id="social-email" placeholder="email@example.com"></div>
          </div>
        </div>
      </div>
      
      <!-- 图片管理页 -->
      <div id="page-images" class="hidden">
        <div class="page-header">
          <h1 class="page-title">图片管理</h1>
        </div>
        <div class="card">
          <h3 class="card-title" style="margin-bottom: 20px;">上传图片</h3>
          <div class="upload-area" onclick="document.getElementById('image-input').click()">
            <p style="font-size: 18px; margin-bottom: 8px;">点击或拖拽上传图片</p>
            <p style="font-size: 13px; color: var(--text-light);">支持 jpg, png, gif, webp</p>
          </div>
          <input type="file" id="image-input" accept="image/*" multiple style="display: none;" onchange="handleImageUpload(event)">
        </div>
        <div class="card">
          <h3 class="card-title" style="margin-bottom: 20px;">当前图片</h3>
          <div class="grid-3" id="image-gallery"></div>
        </div>
      </div>
      
      <!-- 主题样式页 -->
      <div id="page-theme" class="hidden">
        <div class="page-header">
          <h1 class="page-title">主题样式</h1>
          <button class="btn btn-primary" onclick="saveTheme()">💾 保存主题</button>
        </div>
        <div class="grid-2">
          <div class="card">
            <h3 class="card-title" style="margin-bottom: 20px;">颜色配置</h3>
            <div class="form-group"><label>主色调</label><input type="color" id="theme-primary" value="#6366f1" style="height: 48px; padding: 8px;"></div>
            <div class="form-group"><label>背景色</label><input type="color" id="theme-bg" value="#0f172a" style="height: 48px; padding: 8px;"></div>
            <div class="form-group"><label>文字色</label><input type="color" id="theme-text" value="#f8fafc" style="height: 48px; padding: 8px;"></div>
          </div>
          <div class="card">
            <h3 class="card-title" style="margin-bottom: 20px;">效果配置</h3>
            <div class="form-group">
              <label>毛玻璃效果</label>
              <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
                <div class="toggle active" id="theme-glass" onclick="this.classList.toggle('active')"></div>
                <span>启用</span>
              </div>
            </div>
            <div class="form-group">
              <label>动画效果</label>
              <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
                <div class="toggle active" id="theme-animation" onclick="this.classList.toggle('active')"></div>
                <span>启用</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <div id="toast" class="toast hidden"></div>
  
  <script>
    const API_URL = '/api/blog';
    const PASSWORD = 'escape123';
    let articles = [];
    let settings = { title: 'escape', subtitle: '技术 · 生活 · 思考', about: '', github: '', twitter: '', email: '' };
    let theme = { primary: '#6366f1', bg: '#0f172a', text: '#f8fafc', glass: true, animation: true };
    
    // 初始化
    if (localStorage.getItem('admin_logged_in') === 'true') {
      showAdmin();
      loadData();
    }
    
    function login() {
      if (document.getElementById('password').value === PASSWORD) {
        localStorage.setItem('admin_logged_in', 'true');
        showAdmin();
        loadData();
      } else {
        showToast('密码错误！', 'error');
      }
    }
    
    function logout() {
      localStorage.removeItem('admin_logged_in');
      location.reload();
    }
    
    function showAdmin() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('admin-panel').classList.remove('hidden');
      document.getElementById('article-date').value = new Date().toISOString().split('T')[0];
    }
    
    function showPage(page) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('.nav-item')[page === 'dashboard' ? 0 : page === 'articles' ? 1 : page === 'new-article' ? 2 : page === 'settings' ? 3 : page === 'images' ? 4 : 5].classList.add('active');
      document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden'));
      document.getElementById('page-' + page).classList.remove('hidden');
    }
    
    function showToast(msg, type = 'loading') {
      const toast = document.getElementById('toast');
      toast.className = 'toast toast-' + type;
      toast.textContent = msg;
      toast.classList.remove('hidden');
      if (type !== 'loading') setTimeout(() => toast.classList.add('hidden'), 3000);
    }
    
    async function loadData() {
      showToast('加载中...', 'loading');
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'get' }) });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        articles = data.data.articles || [];
        renderArticles();
        showToast('加载成功！', 'success');
      } catch (e) {
        showToast('加载失败: ' + e.message, 'error');
      }
    }
    
    function renderArticles() {
      const published = articles.filter(a => a.status === 'published');
      document.getElementById('stat-articles').textContent = articles.length;
      document.getElementById('stat-published').textContent = published.length;
      
      let recentHtml = '', allHtml = '';
      articles.forEach(article => {
        const badgeClass = article.status === 'published' ? 'badge-success' : 'badge-draft';
        const categoryClass = article.category === 'tech' ? 'badge-tech' : article.category === 'life' ? 'badge-life' : 'badge-draft';
        const categoryName = article.category === 'tech' ? '技术' : article.category === 'life' ? '生活' : '思考';
        const row = '<tr><td><strong>' + article.title + '</strong></td><td><span class="badge ' + categoryClass + '">' + categoryName + '</span></td><td>' + article.date + '</td><td><span class="badge ' + badgeClass + '">' + (article.status === 'published' ? '已发布' : '草稿') + '</span></td><td><button class="btn btn-sm btn-danger" onclick="deleteArticle(' + article.id + ')">删除</button></td></tr>';
        recentHtml += row;
        allHtml += row;
      });
      document.getElementById('recent-articles').innerHTML = recentHtml || '<tr><td colspan="5" style="text-align:center;color:var(--text-light);">暂无文章</td></tr>';
      document.getElementById('all-articles').innerHTML = allHtml || '<tr><td colspan="5" style="text-align:center;color:var(--text-light);">暂无文章</td></tr>';
    }
    
    async function saveArticle() {
      const title = document.getElementById('article-title').value;
      if (!title) { showToast('请输入标题！', 'error'); return; }
      
      const newArticle = {
        id: Date.now(),
        title: title,
        date: document.getElementById('article-date').value,
        category: document.getElementById('article-category').value,
        excerpt: document.getElementById('article-excerpt').value,
        content: document.getElementById('article-content').value,
        status: document.getElementById('article-published').classList.contains('active') ? 'published' : 'draft'
      };
      
      articles.unshift(newArticle);
      
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'save', data: { articles } }) });
        const result = await res.json();
        if (result.error) throw new Error(result.error);
        
        renderArticles();
        document.getElementById('article-title').value = '';
        document.getElementById('article-excerpt').value = '';
        document.getElementById('article-content').value = '';
        showToast('文章保存成功！', 'success');
        showPage('articles');
      } catch (e) {
        showToast('保存失败: ' + e.message, 'error');
      }
    }
    
    async function deleteArticle(id) {
      if (!confirm('确定删除这篇文章？')) return;
      articles = articles.filter(a => a.id !== id);
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'save', data: { articles } }) });
        const result = await res.json();
        if (result.error) throw new Error(result.error);
        renderArticles();
        showToast('删除成功！', 'success');
      } catch (e) {
        showToast('删除失败', 'error');
      }
    }
    
    function saveSettings() {
      showToast('设置已保存！', 'success');
    }
    
    function saveTheme() {
      showToast('主题已保存！', 'success');
    }
    
    function handleImageUpload(e) {
      showToast('图片上传功能开发中...', 'error');
    }
  </script>
</body>
</html>
