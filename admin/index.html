<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>escape 博客后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --bg-soft: #161a22;
      --card: #1d222d;
      --line: #303848;
      --text: #edf0f8;
      --text-muted: #9ca8bf;
      --brand: #5f8dff;
      --brand-soft: rgba(95, 141, 255, 0.16);
      --danger: #f35b6b;
      --ok: #31c17e;
      --radius: 14px;
    }

    body {
      background: radial-gradient(circle at 80% 10%, #1d2743 0%, transparent 34%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .hidden { display: none !important; }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .login-box {
      width: min(92vw, 420px);
      background: rgba(29, 34, 45, 0.86);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px;
      backdrop-filter: blur(8px);
    }

    .login-box h1 {
      font-size: 26px;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .login-box p {
      color: var(--text-muted);
      margin-bottom: 16px;
      font-size: 14px;
    }

    .admin-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: rgba(15, 17, 23, 0.9);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar h2 {
      margin: 6px 8px 14px;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .nav-item {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.22s;
      font-size: 14px;
    }

    .nav-item:hover {
      border-color: var(--line);
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .nav-item.active {
      border-color: rgba(95, 141, 255, 0.44);
      background: var(--brand-soft);
      color: #c9d7ff;
    }

    .main {
      padding: 28px;
      overflow-y: auto;
    }

    .page-title {
      font-size: clamp(24px, 3vw, 32px);
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .card {
      background: rgba(29, 34, 45, 0.84);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }

    .card h3 {
      margin-bottom: 14px;
      font-size: 16px;
    }

    label {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      color: var(--text);
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
    }

    textarea { min-height: 120px; resize: vertical; }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(95, 141, 255, 0.7);
      box-shadow: 0 0 0 3px rgba(95, 141, 255, 0.18);
    }

    .btns { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.primary { background: var(--brand); color: #fff; }
    .btn.secondary { background: transparent; border-color: var(--line); color: var(--text); }
    .btn.danger { background: var(--danger); color: #fff; }

    .article-list,
    .media-list {
      display: grid;
      gap: 10px;
    }

    .row {
      background: rgba(13, 16, 22, 0.7);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .row small { color: var(--text-muted); font-size: 12px; }

    .badge {
      font-size: 11px;
      color: #c9d7ff;
      border: 1px solid rgba(95, 141, 255, 0.5);
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--brand-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .media-preview {
      width: 100%;
      max-height: 200px;
      border-radius: 10px;
      object-fit: cover;
      background: #0f1117;
      border: 1px solid var(--line);
    }

    .inline-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .toast {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 99;
      padding: 12px 14px;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }

    .toast.ok { background: var(--ok); }
    .toast.err { background: var(--danger); }
    .toast.loading { background: var(--brand); }

    @media (max-width: 980px) {
      .admin-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
        flex-direction: row;
        flex-wrap: wrap;
      }

      .sidebar h2 { width: 100%; margin-bottom: 6px; }

      .nav-item.exit { margin-left: 0; }

      .inline-grid {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="login" class="login-screen hidden">
    <div class="login-box">
      <h1>escape 博客后台</h1>
      <p>输入管理密码后进入控制台。</p>
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <div class="btns">
        <button class="btn primary" onclick="login()">登录</button>
      </div>
    </div>
  </div>

  <div id="admin" class="admin-layout">
    <aside class="sidebar">
      <h2>Dashboard</h2>
      <div class="nav-item active" data-page="articles" onclick="showPage('articles')">文章管理</div>
      <div class="nav-item" data-page="media" onclick="showPage('media')">媒体管理</div>
      <div class="nav-item" data-page="settings" onclick="showPage('settings')">网站设置</div>
      <div class="nav-item exit" onclick="logout()">退出登录</div>
    </aside>

    <main class="main">
      <section id="page-articles">
        <h1 class="page-title">文章管理</h1>

        <div class="grid" style="grid-template-columns: 1.1fr 0.9fr;">
          <div class="card">
            <h3>编辑文章</h3>
            <label>标题</label>
            <input id="article-title" type="text" placeholder="例如：如何构建个人知识库">

            <div class="inline-grid">
              <div>
                <label>分类</label>
                <select id="article-category">
                  <option value="tech">技术</option>
                  <option value="thought">思考</option>
                  <option value="life">生活</option>
                  <option value="other">其他</option>
                </select>
              </div>
              <div>
                <label>状态</label>
                <select id="article-status">
                  <option value="published">已发布</option>
                  <option value="draft">草稿</option>
                </select>
              </div>
            </div>

            <label>摘要</label>
            <input id="article-excerpt" type="text" placeholder="一句话说明内容">

            <label>正文</label>
            <textarea id="article-content" placeholder="支持纯文本，前台自动换行显示"></textarea>

            <div class="inline-grid">
              <div>
                <label>封面图 URL</label>
                <input id="article-image-url" type="url" placeholder="https://...">
                <input id="article-image-file" type="file" accept="image/*" class="hidden" onchange="uploadArticleMedia(event, 'image')">
                <div class="toolbar">
                  <button class="btn secondary" onclick="pickMediaFile('article-image-file')">上传图片</button>
                  <button class="btn secondary" onclick="previewArticleMedia()">预览媒体</button>
                </div>
              </div>
              <div>
                <label>视频 URL</label>
                <input id="article-video-url" type="url" placeholder="https://...mp4">
                <input id="article-video-file" type="file" accept="video/*" class="hidden" onchange="uploadArticleMedia(event, 'video')">
                <div class="toolbar">
                  <button class="btn secondary" onclick="pickMediaFile('article-video-file')">上传视频</button>
                </div>
              </div>
            </div>

            <div class="btns">
              <button class="btn primary" onclick="saveArticle()">保存文章</button>
              <button class="btn secondary" onclick="clearForm()">重置表单</button>
            </div>
          </div>

          <div class="card">
            <h3>媒体预览</h3>
            <img id="preview-image" class="media-preview hidden" alt="image preview">
            <video id="preview-video" class="media-preview hidden" controls preload="metadata"></video>
            <p id="media-hint" style="color: var(--text-muted); font-size: 13px; margin-top: 8px;">上传或填入 URL 后可在这里预览。</p>
          </div>
        </div>

        <div class="card" style="margin-top: 16px;">
          <h3>所有文章</h3>
          <div id="article-list" class="article-list"></div>
        </div>
      </section>

      <section id="page-media" class="hidden">
        <h1 class="page-title">媒体管理</h1>

        <div class="card">
          <h3>上传媒体到仓库</h3>
          <div class="inline-grid">
            <div>
              <label>选择图片</label>
              <input id="media-image-file" type="file" accept="image/*" onchange="uploadStandaloneMedia(event, 'image')">
            </div>
            <div>
              <label>选择视频</label>
              <input id="media-video-file" type="file" accept="video/*" onchange="uploadStandaloneMedia(event, 'video')">
            </div>
          </div>
          <p id="upload-status" style="margin-top: 8px; color: var(--text-muted); font-size: 13px;">图片会自动压缩后上传；视频建议使用 URL（直传受平台大小限制）。</p>
        </div>

        <div class="card">
          <h3>通过 URL 添加</h3>
          <div class="inline-grid">
            <div>
              <label>媒体类型</label>
              <select id="media-url-type">
                <option value="image">图片</option>
                <option value="video">视频</option>
              </select>
            </div>
            <div>
              <label>媒体 URL</label>
              <input id="media-url" type="url" placeholder="https://...">
            </div>
          </div>
          <div class="btns">
            <button class="btn primary" onclick="addMediaUrl()">添加到媒体库</button>
          </div>
        </div>

        <div class="card">
          <h3>媒体库</h3>
          <div id="media-list" class="media-list"></div>
        </div>
      </section>

      <section id="page-settings" class="hidden">
        <h1 class="page-title">网站设置</h1>
        <div class="card" style="max-width: 620px;">
          <h3>基础信息</h3>
          <label>网站标题</label>
          <input id="setting-title" type="text" placeholder="escape">
          <label>网站副标题</label>
          <input id="setting-subtitle" type="text" placeholder="逃离现实，记录真实想法。">
          <div class="btns">
            <button class="btn primary" onclick="saveSettings()">保存设置</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    const API_URL = '/api/blog';
    const ADMIN_PASSWORD = 'escape123';

    let store = { articles: [], settings: {} };
    let editingId = null;
    const CLIENT_UPLOAD_LIMIT_BYTES = Math.floor(2.8 * 1024 * 1024);
    const IMAGE_MAX_DIMENSION = 1920;

    function showToast(message, type = 'ok', timeout = 2600) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.classList.remove('hidden');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.add('hidden'), timeout);
    }

    function sanitizeText(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getArticles() {
      return Array.isArray(store.articles) ? store.articles : [];
    }

    function mediaItemsFromArticles() {
      const items = [];
      for (const a of getArticles()) {
        if (a.image_url) {
          items.push({ id: `${a.id}-image`, articleId: a.id, kind: 'image', url: a.image_url, title: a.title || '未命名媒体' });
        }
        if (a.video_url) {
          items.push({ id: `${a.id}-video`, articleId: a.id, kind: 'video', url: a.video_url, title: a.title || '未命名媒体' });
        }
      }
      return items;
    }

    function login() {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('admin').classList.remove('hidden');
      loadData();
    }

    function logout() {
      document.getElementById('admin').classList.add('hidden');
      document.getElementById('login').classList.remove('hidden');
      document.getElementById('password').value = '';
    }

    async function api(action, data = {}) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, data })
      });

      let payload = {};
      try {
        payload = await res.json();
      } catch (_) {}

      if (!res.ok) {
        if (res.status === 413) {
          throw new Error('文件过大（Vercel 限制）。请压缩到 2.8MB 内，或使用 URL 方式。');
        }
        throw new Error(payload.error || `Request failed: ${res.status}`);
      }

      return payload;
    }

    function checkClientFileSize(file, kind) {
      if (file.size > CLIENT_UPLOAD_LIMIT_BYTES) {
        if (kind === 'video') {
          throw new Error('视频过大，当前环境不适合直传视频。请先上传到网盘/图床后使用 URL。');
        }
        throw new Error('图片过大，系统会尝试自动压缩；若仍失败请改用 URL。');
      }
    }

    async function loadData() {
      try {
        const result = await api('get');
        const data = result.data || {};
        store.articles = Array.isArray(data.articles) ? data.articles : [];
        store.settings = data.settings || {};

        document.getElementById('setting-title').value = store.settings.title || 'escape';
        document.getElementById('setting-subtitle').value = store.settings.subtitle || '逃离现实，记录真实想法。';

        renderArticles();
        renderMedia();
      } catch (err) {
        showToast(`加载失败: ${err.message}`, 'err', 4200);
      }
    }

    async function persistStore() {
      const payload = {
        articles: getArticles(),
        settings: store.settings || {}
      };
      return await api('save', payload);
    }

    function showPage(page) {
      document.querySelectorAll('.nav-item[data-page]').forEach(item => {
        item.classList.toggle('active', item.dataset.page === page);
      });

      ['articles', 'media', 'settings'].forEach(name => {
        document.getElementById(`page-${name}`).classList.toggle('hidden', name !== page);
      });
    }

    function renderArticles() {
      const list = document.getElementById('article-list');
      const items = getArticles().slice().sort((a, b) => (b.id || 0) - (a.id || 0));

      if (!items.length) {
        list.innerHTML = '<div class="row"><small>暂无文章</small></div>';
        return;
      }

      list.innerHTML = items.map(a => {
        const title = sanitizeText(a.title || '未命名文章');
        const meta = sanitizeText(`${a.date || ''} · ${a.category || 'other'} · ${a.status || 'published'}`);
        const mediaBadges = [a.image_url ? '<span class="badge">image</span>' : '', a.video_url ? '<span class="badge">video</span>' : ''].join(' ');

        return `
          <div class="row">
            <div class="row-head">
              <strong>${title}</strong>
              <div class="btns">
                <button class="btn secondary" onclick="editArticle(${Number(a.id)})">编辑</button>
                <button class="btn danger" onclick="deleteArticle(${Number(a.id)})">删除</button>
              </div>
            </div>
            <small>${meta}</small>
            <div>${mediaBadges}</div>
          </div>
        `;
      }).join('');
    }

    function clearForm() {
      editingId = null;
      document.getElementById('article-title').value = '';
      document.getElementById('article-category').value = 'tech';
      document.getElementById('article-status').value = 'published';
      document.getElementById('article-excerpt').value = '';
      document.getElementById('article-content').value = '';
      document.getElementById('article-image-url').value = '';
      document.getElementById('article-video-url').value = '';
      document.getElementById('article-image-file').value = '';
      document.getElementById('article-video-file').value = '';
      previewArticleMedia();
    }

    function editArticle(id) {
      const article = getArticles().find(item => Number(item.id) === Number(id));
      if (!article) return;

      editingId = Number(id);
      document.getElementById('article-title').value = article.title || '';
      document.getElementById('article-category').value = article.category || 'tech';
      document.getElementById('article-status').value = article.status || 'published';
      document.getElementById('article-excerpt').value = article.excerpt || '';
      document.getElementById('article-content').value = article.content || '';
      document.getElementById('article-image-url').value = article.image_url || '';
      document.getElementById('article-video-url').value = article.video_url || '';
      previewArticleMedia();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteArticle(id) {
      if (!confirm('确定删除这篇文章？')) return;

      store.articles = getArticles().filter(a => Number(a.id) !== Number(id));
      try {
        showToast('保存中...', 'loading', 5000);
        await persistStore();
        renderArticles();
        renderMedia();
        showToast('已删除', 'ok');
      } catch (err) {
        showToast(`删除失败: ${err.message}`, 'err', 4200);
      }
    }

    async function saveArticle() {
      const title = document.getElementById('article-title').value.trim();
      const category = document.getElementById('article-category').value;
      const status = document.getElementById('article-status').value;
      const excerpt = document.getElementById('article-excerpt').value.trim();
      const content = document.getElementById('article-content').value.trim();
      const image_url = document.getElementById('article-image-url').value.trim();
      const video_url = document.getElementById('article-video-url').value.trim();

      if (!title) {
        showToast('请输入标题', 'err');
        return;
      }

      const entry = {
        id: editingId || Date.now(),
        title,
        category,
        status,
        excerpt,
        content,
        image_url,
        video_url,
        date: new Date().toISOString().slice(0, 10)
      };

      if (editingId) {
        store.articles = getArticles().map(a => Number(a.id) === Number(editingId) ? { ...a, ...entry } : a);
      } else {
        store.articles = [...getArticles(), entry];
      }

      try {
        showToast('保存中...', 'loading', 5000);
        await persistStore();
        renderArticles();
        renderMedia();
        showToast('保存成功', 'ok');
        clearForm();
      } catch (err) {
        showToast(`保存失败: ${err.message}`, 'err', 4200);
      }
    }

    function previewArticleMedia() {
      const imageUrl = document.getElementById('article-image-url').value.trim();
      const videoUrl = document.getElementById('article-video-url').value.trim();
      const image = document.getElementById('preview-image');
      const video = document.getElementById('preview-video');
      const hint = document.getElementById('media-hint');

      if (imageUrl) {
        image.src = imageUrl;
        image.classList.remove('hidden');
      } else {
        image.src = '';
        image.classList.add('hidden');
      }

      if (videoUrl) {
        video.src = videoUrl;
        video.classList.remove('hidden');
      } else {
        video.src = '';
        video.classList.add('hidden');
      }

      hint.textContent = (imageUrl || videoUrl) ? '已加载预览。' : '上传或填入 URL 后可在这里预览。';
    }

    function pickMediaFile(inputId) {
      document.getElementById(inputId).click();
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const raw = String(e.target.result || '');
          resolve(raw.includes(',') ? raw.split(',')[1] : raw);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function loadImageElement(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('图片解析失败'));
        };
        img.src = url;
      });
    }

    async function compressImageToBase64(file) {
      if (file.size <= CLIENT_UPLOAD_LIMIT_BYTES) {
        return {
          fileData: await blobToBase64(file),
          mimeType: file.type || 'image/jpeg',
          fileName: file.name
        };
      }

      const img = await loadImageElement(file);
      let width = img.width;
      let height = img.height;
      const ratio = Math.min(1, IMAGE_MAX_DIMENSION / Math.max(width, height));
      width = Math.max(1, Math.floor(width * ratio));
      height = Math.max(1, Math.floor(height * ratio));

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      let quality = 0.88;
      for (let i = 0; i < 8; i++) {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
        if (!blob) {
          throw new Error('图片压缩失败');
        }

        if (blob.size <= CLIENT_UPLOAD_LIMIT_BYTES) {
          const name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
          return {
            fileData: await blobToBase64(blob),
            mimeType: 'image/jpeg',
            fileName: name
          };
        }

        quality -= 0.1;
      }

      throw new Error('图片压缩后仍超过上限，请改用 URL。');
    }

    async function readAsBase64(file) {
      return await blobToBase64(file);
    }

    async function uploadFileToRepo(file, kind) {
      if (kind === 'image') {
        const payload = await compressImageToBase64(file);
        return await api('uploadAsset', {
          fileData: payload.fileData,
          fileName: payload.fileName,
          mimeType: payload.mimeType,
          kind
        });
      }

      checkClientFileSize(file, kind);
      const base64 = await readAsBase64(file);
      return await api('uploadAsset', {
        fileData: base64,
        fileName: file.name,
        mimeType: file.type,
        kind
      });
    }

    async function uploadArticleMedia(event, kind) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      try {
        showToast(kind === 'image' ? '图片处理中...' : '上传中...', 'loading', 9000);
        const result = await uploadFileToRepo(file, kind);
        if (!result.success || !result.url) {
          throw new Error(result.error || '上传失败');
        }

        if (kind === 'image') {
          document.getElementById('article-image-url').value = result.url;
        } else {
          document.getElementById('article-video-url').value = result.url;
        }

        previewArticleMedia();
        showToast(`${kind === 'image' ? '图片' : '视频'}上传成功`, 'ok');
      } catch (err) {
        showToast(`上传失败: ${err.message}`, 'err', 4200);
      } finally {
        event.target.value = '';
      }
    }

    async function uploadStandaloneMedia(event, kind) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const status = document.getElementById('upload-status');
      try {
        status.textContent = kind === 'image' ? '图片处理中并上传中...' : '上传中...';
        status.style.color = '#7da0ff';

        const result = await uploadFileToRepo(file, kind);
        if (!result.success || !result.url) {
          throw new Error(result.error || '上传失败');
        }

        const item = {
          id: Date.now(),
          title: `${kind === 'image' ? '图片' : '视频'}_${Date.now()}`,
          category: 'other',
          status: 'published',
          excerpt: '',
          content: '',
          image_url: kind === 'image' ? result.url : '',
          video_url: kind === 'video' ? result.url : '',
          date: new Date().toISOString().slice(0, 10)
        };

        store.articles = [...getArticles(), item];
        await persistStore();
        renderArticles();
        renderMedia();

        status.textContent = `上传成功: ${result.url}`;
        status.style.color = '#49d08f';
        showToast('媒体已加入媒体库', 'ok');
      } catch (err) {
        status.textContent = `上传失败: ${err.message}`;
        status.style.color = '#ff6c79';
        showToast(`上传失败: ${err.message}`, 'err', 4200);
      } finally {
        event.target.value = '';
      }
    }

    async function addMediaUrl() {
      const type = document.getElementById('media-url-type').value;
      const url = document.getElementById('media-url').value.trim();

      if (!url) {
        showToast('请输入 URL', 'err');
        return;
      }

      const item = {
        id: Date.now(),
        title: `${type === 'image' ? '图片' : '视频'}_${Date.now()}`,
        category: 'other',
        status: 'published',
        excerpt: '',
        content: '',
        image_url: type === 'image' ? url : '',
        video_url: type === 'video' ? url : '',
        date: new Date().toISOString().slice(0, 10)
      };

      store.articles = [...getArticles(), item];

      try {
        await persistStore();
        document.getElementById('media-url').value = '';
        renderArticles();
        renderMedia();
        showToast('已添加到媒体库', 'ok');
      } catch (err) {
        showToast(`保存失败: ${err.message}`, 'err', 4200);
      }
    }

    function renderMedia() {
      const list = document.getElementById('media-list');
      const items = mediaItemsFromArticles();

      if (!items.length) {
        list.innerHTML = '<div class="row"><small>暂无媒体</small></div>';
        return;
      }

      list.innerHTML = items.map(item => {
        const title = sanitizeText(item.title);
        const url = sanitizeText(item.url);
        const preview = item.kind === 'image'
          ? `<img src="${url}" class="media-preview" alt="${title}" onerror="this.style.opacity='0.2'">`
          : `<video src="${url}" class="media-preview" controls preload="metadata"></video>`;

        return `
          <div class="row">
            <div class="row-head">
              <strong>${title}</strong>
              <div class="btns">
                <button class="btn secondary" onclick="copyMediaUrl('${url.replace(/'/g, "\\'")}')">复制 URL</button>
                <button class="btn danger" onclick="removeMediaRef(${Number(item.articleId)}, '${item.kind}')">移除</button>
              </div>
            </div>
            ${preview}
            <small>${url}</small>
          </div>
        `;
      }).join('');
    }

    async function removeMediaRef(articleId, kind) {
      store.articles = getArticles().map(a => {
        if (Number(a.id) !== Number(articleId)) return a;
        return {
          ...a,
          image_url: kind === 'image' ? '' : (a.image_url || ''),
          video_url: kind === 'video' ? '' : (a.video_url || '')
        };
      });

      try {
        await persistStore();
        renderArticles();
        renderMedia();
        showToast('已移除媒体引用', 'ok');
      } catch (err) {
        showToast(`操作失败: ${err.message}`, 'err', 4200);
      }
    }

    async function copyMediaUrl(url) {
      try {
        await navigator.clipboard.writeText(url);
        showToast('URL 已复制', 'ok');
      } catch (_) {
        showToast('复制失败，请手动复制', 'err');
      }
    }

    async function saveSettings() {
      store.settings = {
        title: document.getElementById('setting-title').value.trim() || 'escape',
        subtitle: document.getElementById('setting-subtitle').value.trim() || '逃离现实，记录真实想法。'
      };

      try {
        await persistStore();
        showToast('设置已保存', 'ok');
      } catch (err) {
        showToast(`保存失败: ${err.message}`, 'err', 4200);
      }
    }

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    document.getElementById('article-image-url').addEventListener('input', previewArticleMedia);
    document.getElementById('article-video-url').addEventListener('input', previewArticleMedia);
    loadData();
  </script>
</body>
</html>
